name: Collect official source updates

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      COLLECTION_URL: ${{ secrets.COLLECTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check scheduler connection
        run: |
          if [ -z "$COLLECTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Collection secrets are not connected yet; skipping this run."
            exit 0
          fi

      - name: Request protected collection endpoint
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$COLLECTION_URL"
